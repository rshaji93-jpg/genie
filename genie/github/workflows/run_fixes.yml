name: Auto Apply Final Fixes

on:
  push:
    paths:
      - "apply_final_fixes.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Master Fix Script & Clean Up
        run: |
          if [ -f apply_final_fixes.py ]; then
            python3 apply_final_fixes.py
            rm -f apply_final_fixes.py
          fi

      - name: Commit and Push Updated Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-applied final PWA, Call Genie, WhatsApp call, and Admin fixes"
          git push origin main
          
