steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --file
      - Genie_New_Architech/backend/Dockerfile
      - Genie_New_Architech/backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --platform=managed
      - --port=8000
      - --allow-unauthenticated
      - --set-env-vars=GENIE_DB_PATH=/tmp/genie_archive.sqlite3,GENIE_BACKUP_DB_PATH=/app/data/genie_archive.sqlite3
      - --add-volume=name=genie-data,type=cloud-storage,bucket=${_DATA_BUCKET}
      - --add-volume-mount=volume=genie-data,mount-path=/app/data

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

substitutions:
  _REGION: asia-south1
  _SERVICE: genie-backend
  _REPOSITORY: genie
  _DATA_BUCKET: ""

options:
  logging: CLOUD_LOGGING_ONLY
